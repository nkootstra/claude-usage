name: ClaudeUsage
options:
  bundleIdPrefix: io.kootstra
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: WQ8V5KRNUG
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: "4.2.2"
  LaunchAtLogin-Modern:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern.git
    from: "1.1.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.5.0"

targets:
  ClaudeUsageCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ClaudeUsageCore
    dependencies:
      - package: KeychainAccess
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kootstra.claude-usage.core
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeUsageCore

  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeUsageApp
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ClaudeUsageCore
      - package: LaunchAtLogin-Modern
        product: LaunchAtLogin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kootstra.claude-usage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeUsage.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

  ClaudeUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClaudeUsageTests
    dependencies:
      - target: ClaudeUsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kootstra.claude-usage.tests
